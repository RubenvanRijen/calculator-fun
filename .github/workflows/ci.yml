name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck & unit tests · Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci

      - name: Typecheck sources
        run: npx tsc -p tsconfig.json --noEmit

      - name: Typecheck tests
        run: npx tsc -p tsconfig.test.json

      - name: Unit tests
        run: npx vitest run --reporter=verbose

      - name: Build to dist/
        run: npm run build

      - name: Check dist/ was produced
        run: test -f dist/index.js && test -f dist/calculator.js

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Fails if coverage drops below the thresholds in vitest.config.ts.
      - run: npm run coverage
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  e2e:
    name: E2E (real browser)
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Install browsers
        run: npx playwright install --with-deps chromium

      # playwright.config.ts builds dist/ and serves it statically first, so
      # this exercises the same files the image ships.
      - name: Run Playwright
        run: npx playwright test

      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    # Tests are deliberately not run inside the image, so gate it here instead.
    needs: [test]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: prod
          push: false
          load: true
          tags: calculator-fun:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the container
        run: |
          docker run -d --name calc -p 8080:80 calculator-fun:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/ >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://localhost:8080/ | grep -q "calculator-grid"
          curl -fsS http://localhost:8080/dist/calculator.js >/dev/null
          curl -fsS http://localhost:8080/dist/expression.js >/dev/null
          curl -fsS http://localhost:8080/styles.css >/dev/null
          curl -fsS http://localhost:8080/favicon.svg >/dev/null
          docker rm -f calc
