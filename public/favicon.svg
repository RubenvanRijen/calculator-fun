<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Calculator">
  <title>calculator-fun</title>
  <defs>
    <!-- The same yellow-to-pink gradient the page background uses. -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffb00"/>
      <stop offset="1" stop-color="#ff00aa"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="13" fill="url(#bg)"/>

  <!-- Output panel, matching the .output block in styles.css. -->
  <rect x="11" y="9" width="42" height="15" rx="3" fill="#000" opacity=".75"/>
  <rect x="34" y="14" width="15" height="5" rx="2" fill="#fff" opacity=".9"/>

  <!-- Two rows of chunky keys: shapes stay legible down at 16px. -->
  <g fill="#fff" opacity=".92">
    <rect x="11" y="30" width="12" height="10" rx="2.5"/>
    <rect x="26" y="30" width="12" height="10" rx="2.5"/>
    <rect x="41" y="30" width="12" height="10" rx="2.5"/>
    <rect x="11" y="44" width="12" height="10" rx="2.5"/>
    <rect x="26" y="44" width="12" height="10" rx="2.5"/>
    <rect x="41" y="44" width="12" height="10" rx="2.5"/>
  </g>
</svg>
