<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator fun Ruben</title>
    <link href="/favicon.svg" rel="icon" type="image/svg+xml">
    <link href="/styles.css" rel="stylesheet">
    <script type="module" src="/dist/index.js" defer></script>
</head>

<body>
    <main class="app">
        <div class="calculator-grid">
            <div class="output">
                <div class="output-meta">
                    <span data-memory-indicator class="memory-indicator" hidden>M</span>
                    <div data-previous-operand class="previous-operand"></div>
                </div>
                <div data-current-operand class="current-operand"></div>
                <div data-error class="error" role="alert" hidden></div>
            </div>

            <button data-memory="clear" class="key-memory">MC</button>
            <button data-memory="recall" class="key-memory">MR</button>
            <button data-memory="add" class="key-memory">M+</button>
            <button data-memory="subtract" class="key-memory">M−</button>

            <button data-all-clear>AC</button>
            <button data-delete>DEL</button>
            <button data-sign>±</button>
            <button data-operation>÷</button>

            <button data-number>1</button>
            <button data-number>2</button>
            <button data-number>3</button>
            <button data-operation>*</button>

            <button data-number>4</button>
            <button data-number>5</button>
            <button data-number>6</button>
            <button data-operation>+</button>

            <button data-number>7</button>
            <button data-number>8</button>
            <button data-number>9</button>
            <button data-operation>-</button>

            <button data-number>.</button>
            <button data-number>0</button>
            <button data-percent>%</button>
            <button data-equals>=</button>
        </div>

        <aside class="history">
            <div class="history-header">
                <h2 class="history-title">History</h2>
                <button data-history-clear class="history-clear" type="button">Clear</button>
            </div>
            <p data-history-empty class="history-empty">Nothing yet.</p>
            <ul data-history-list class="history-list"></ul>
        </aside>
    </main>

    <p class="hint">
        Keyboard: digits, <kbd>+</kbd> <kbd>-</kbd> <kbd>*</kbd> <kbd>/</kbd> <kbd>%</kbd>,
        <kbd>Enter</kbd> to equal, <kbd>Backspace</kbd> to delete, <kbd>Esc</kbd> to clear.
    </p>
</body>

</html>
