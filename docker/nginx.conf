server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The pages load ES modules; without the right type the browser refuses.
    types {
        text/html                 html;
        text/css                  css;
        text/javascript           js mjs;
        application/json          json map;
        image/png                 png;
        image/gif                 gif;
        image/svg+xml             svg;
    }
    default_type application/octet-stream;

    location / {
        try_files $uri $uri/ =404;
    }
}
